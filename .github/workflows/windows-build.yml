name: Windows build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-opencv

      - name: Build redux.exe
        working-directory: src
        run: |
          set -euxo pipefail
          DEFAULT_FLAGS='-DBORDER_LAYOUT=0 -DDEFAULT_FONT=0 -DDEFAULT_COLORMAP=4 -DROTATION=0 -DDISPLAY_WIDTH=2560 -DDISPLAY_HEIGHT=1600 -DUSE_CELSIUS=0 -DHUD_ALPHA=0.4'
          CFLAGS='-march=x86-64 -mtune=generic -pipe -fomit-frame-pointer'
          OPENCV_LIBS='-lopencv_videoio -lopencv_highgui -lopencv_imgcodecs -lopencv_imgproc -lopencv_core'
          g++ -std=c++17 -Wall -Wextra -O2 -ffast-math ${DEFAULT_FLAGS} ${CFLAGS} -DUSE_ASSERT=0 tc001.cpp thread.cpp -o redux.exe -lpthread $(pkg-config --cflags opencv4) ${OPENCV_LIBS}
          ldd redux.exe | tee ../redux-ldd.txt
          ! grep "not found" ../redux-ldd.txt | grep -vi "api-ms-win-crt-"

      - name: Package runtime DLLs
        working-directory: src
        run: |
          set -euxo pipefail
          mkdir -p ../dist/windows-x64
          cp redux.exe ../dist/windows-x64/Thermal-Camera-Redux.exe
          cp ../run_uti260b_windows.cmd ../dist/windows-x64/
          declare -A copied
          copy_mingw_deps() {
            local queue=("$1")
            while [ "${#queue[@]}" -gt 0 ]; do
              local target="${queue[0]}"
              queue=("${queue[@]:1}")
              while read -r dll_name; do
                local key
                key="$(printf '%s' "$dll_name" | tr '[:upper:]' '[:lower:]')"
                if [ -n "${copied[$key]:-}" ]; then
                  continue
                fi
                local dll_path
                dll_path="$(find "$MINGW_PREFIX/bin" -maxdepth 1 -iname "$dll_name" -print -quit)"
                if [ -z "$dll_path" ]; then
                  continue
                fi
                copied[$key]=1
                cp -n "$dll_path" ../dist/windows-x64/
                queue+=("$dll_path")
              done < <(objdump -p "$target" | awk '/DLL Name:/ { print $3 }')
            done
          }
          copy_mingw_deps redux.exe
          find "$MINGW_PREFIX/bin" -maxdepth 1 -type f \( -iname '*opencv_videoio*.dll' -o -iname '*opencv_highgui*.dll' \) -exec cp -n {} ../dist/windows-x64/ \;
          find ../dist/windows-x64 -maxdepth 1 -type f \( -iname '*opencv_videoio*.dll' -o -iname '*opencv_highgui*.dll' \) | while read -r plugin; do
            copy_mingw_deps "$plugin"
          done
          for qt_plugins in "$MINGW_PREFIX/share/qt6/plugins" "$MINGW_PREFIX/share/qt5/plugins"; do
            if [ -f "$qt_plugins/platforms/qwindows.dll" ]; then
              mkdir -p ../dist/windows-x64/platforms
              cp -n "$qt_plugins/platforms/qwindows.dll" ../dist/windows-x64/platforms/
              printf '[Paths]\nPlugins=.\n' > ../dist/windows-x64/qt.conf
            fi
          done
          du -sh ../dist/windows-x64
          find ../dist/windows-x64 -maxdepth 2 -type f -printf '%P\n' | sort

      - name: Smoke test packaged binary
        working-directory: dist/windows-x64
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $runtimeDir = (Get-Location).Path
          $env:Path = "$runtimeDir;C:\Windows\System32;C:\Windows\System;C:\Windows"
          & .\Thermal-Camera-Redux.exe -help
          $status = $LASTEXITCODE
          Write-Host "Thermal-Camera-Redux.exe -help exited $status"
          if ($status -ne 255 -and $status -ne -1) {
            $toolchainBin = Join-Path $env:RUNNER_TEMP 'msys64\mingw64\bin'
            if (Test-Path $toolchainBin) {
              $env:Path = "$runtimeDir;$toolchainBin;C:\Windows\System32;C:\Windows\System;C:\Windows"
              & .\Thermal-Camera-Redux.exe -help
              Write-Host "Thermal-Camera-Redux.exe -help with toolchain PATH exited $LASTEXITCODE"
              $env:Path = "$runtimeDir;C:\Windows\System32;C:\Windows\System;C:\Windows"
            }
            $depsDir = Join-Path $env:RUNNER_TEMP 'dependencies-cli'
            $depsZip = Join-Path $env:RUNNER_TEMP 'dependencies-cli.zip'
            Invoke-WebRequest -Uri 'https://github.com/lucasg/Dependencies/releases/download/v1.11.1/Dependencies_x64_Release_.without.peview.exe.zip' -OutFile $depsZip
            Expand-Archive -LiteralPath $depsZip -DestinationPath $depsDir -Force
            & (Join-Path $depsDir 'Dependencies.exe') -chain .\Thermal-Camera-Redux.exe
            Get-ChildItem -Recurse | Sort-Object FullName | Format-Table FullName, Length
            exit $status
          }

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: thermal-camera-redux-windows-x64
          path: dist/windows-x64/
