name: Linux build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libopencv-dev

      - name: Build redux
        working-directory: src
        run: |
          set -euxo pipefail
          DEFAULT_FLAGS='-DBORDER_LAYOUT=0 -DDEFAULT_FONT=0 -DDEFAULT_COLORMAP=4 -DROTATION=0 -DDISPLAY_WIDTH=2560 -DDISPLAY_HEIGHT=1600 -DUSE_CELSIUS=0 -DHUD_ALPHA=0.4'
          CFLAGS='-march=x86-64 -mtune=generic -pipe -fomit-frame-pointer'
          g++ -Wall -Wextra -O3 -ffast-math ${DEFAULT_FLAGS} ${CFLAGS} -DUSE_ASSERT=0 -I/usr/include/opencv4 tc001.cpp thread.cpp -o redux -lpthread $(pkg-config --cflags --libs opencv4)
          gcc -Wall test_driver.c -o test_driver
          set +e
          ./redux -help
          status=$?
          set -e
          test "${status}" -eq 0 -o "${status}" -eq 255

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: thermal-camera-redux-linux-x64
          path: |
            src/redux
            src/test_driver
